# ==============================================================================
# GitHub Actions CI - Testes Automatizados (Pytest) + Compilacao ESP32 + Wokwi CI
# ==============================================================================
name: Vinheria CP5 - Wokwi IoT & Dashboard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dashboard-tests:
    name: Testes Automatizados do Dashboard (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependencias (requirements.txt)
        run: pip install -r dashboard/requirements.txt

      - name: Executar Suite TDD (Pytest)
        working-directory: dashboard
        env:
          PYTHONPATH: .
        run: pytest tests -v

  wokwi-esp32-simulation:
    name: Compilar ESP32 & Simular no Wokwi CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar Core ESP32
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compilar Firmware ESP32
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-path ./build sketch.ino

      - name: Executar Simulacao Wokwi CI (DHT22 + LDR + Buzzer + LEDs)
        if: ${{ secrets.WOKWI_CLI_TOKEN != '' }}
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: '.'
          timeout: 15000
          expect_text: "VINHERIA AGNELLO"

      - name: Info Wokwi CI Token
        if: ${{ secrets.WOKWI_CLI_TOKEN == '' }}
        run: |
          echo "Simulação Wokwi CI ignorada com sucesso (WOKWI_CLI_TOKEN não configurado nos secrets do GitHub)."
